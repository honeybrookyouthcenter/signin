# Tests the new sign-in app (Rust server + Svelte pages), builds signin.exe,
# and tries the installer on a real Windows machine.
# Pushing a tag like v2.0.0 also publishes the download as a GitHub release.
name: Sign In (Rust + Svelte)

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'server/**'
      - 'web/**'
      - 'install/**'
      - '.github/workflows/signin.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check, test and build the web pages
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: test-${{ runner.os }}-${{ hashFiles('server/Cargo.lock') }}
      - name: Test the server
        working-directory: server
        run: cargo test

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web pages
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: build-${{ runner.os }}-${{ hashFiles('server/Cargo.lock') }}
      # The web pages are baked into the exe, so this must run after they are built.
      - name: Build signin.exe
        working-directory: server
        run: cargo build --release

      # Everything staff download: the program, its settings file and the installer.
      - name: Collect the download
        shell: bash
        run: |
          mkdir download
          cp server/target/release/signin.exe install/* README.md download/

      # Runs the installer for real, the way staff would, then checks the
      # program answers. Running it a second time checks that updating works.
      - name: Try the installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($run in 'install', 'update') {
            powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File download\install.ps1
            if ($LASTEXITCODE -ne 0) { throw "The installer failed ($run)" }
            $config = Invoke-RestMethod http://127.0.0.1:8080/api/kiosk/config
            if ($config.name -ne 'Honey Brook Youth Center') { throw "The program is not answering ($run)" }
          }
          if (-not (Test-Path C:\YouthCenterSignIn\data\signin.db)) { throw 'No database was created' }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Startup'))\Youth Center Sign In.lnk")) { throw 'No startup shortcut' }
          Get-NetFirewallRule -DisplayName 'Youth Center Sign In' | Format-List DisplayName, Enabled, Profile, Action
          Invoke-RestMethod http://127.0.0.1:8080/api/admin/status | ConvertTo-Json -Depth 5
          Stop-Process -Name signin

      - name: Show the program's log if that failed
        if: failure()
        shell: powershell
        run: |
          Get-Process signin -ErrorAction SilentlyContinue | Format-Table Id, StartTime
          netstat -ano | Select-String ':8080'
          Get-ChildItem C:\YouthCenterSignIn -Recurse | Select-Object FullName, Length
          Get-Content C:\YouthCenterSignIn\data\logs\* -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: YouthCenterSignIn
          path: download
      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path download\* -DestinationPath YouthCenterSignIn.zip
          gh release create $env:GITHUB_REF_NAME --generate-notes YouthCenterSignIn.zip
